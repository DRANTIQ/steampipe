# Catalog of frameworks to seed. Add new frameworks, providers, or categories here.
# Then run: PYTHONPATH=cloud-compliance-engine python -m app.scripts.seed_catalog
#
# framework_id: unique key (e.g. cis_aws_v6, cost_optimization_aws, cis_azure_v1)
# provider: aws | azure | gcp
# category: compliance | cost_optimization | security | ...
# controls_path: path to YAML (control definitions), relative to cloud-compliance-engine/
# rules_path: path to JSON (queries/rules), relative to cloud-compliance-engine/

frameworks:
  - framework_id: cis_aws_v6
    provider: aws
    category: compliance
    controls_path: config/cis_v6_controls.yaml
    rules_path: queries/cis_v6_queries.json
    framework_title: "CIS AWS Foundations Benchmark v6.0.0"
    version_name: "6.0.0"

  # Example: add cost optimization later
  # - framework_id: cost_optimization_aws
  #   provider: aws
