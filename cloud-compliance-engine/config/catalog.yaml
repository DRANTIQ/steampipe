# Catalog of frameworks to seed. Add new frameworks, providers, or categories here.
# Then run: PYTHONPATH=cloud-compliance-engine python -m app.scripts.seed_catalog
#
# Evaluation rules come from repo-root data/queries.json (NOT a duplicate file here).
# Stage 1: scripts/apply_queries_document.py loads SQL into public.queries
# Stage 2: seed_catalog + RuleRegistry read extra_metadata from same catalog

frameworks:
  - framework_id: cis_aws_v6
    provider: aws
    category: compliance
    controls_path: config/cis_v6_controls.yaml
    rules_source: data/queries.json
    framework_title: "CIS AWS Foundations Benchmark v6.0.0"
    version_name: "6.0.0"
