# CIS AWS Foundations Benchmark v6.0.0 — Control Definitions
# Source: CIS_Amazon_Web_Services_Foundations_Benchmark_v6.0.0.pdf
# Reference: docs/CIS_V6_REFERENCE.md
# SQL queries: queries/cis_v6_queries.json (Steampipe AWS plugin)
#
# Use control_ref to map Steampipe query extra_metadata.control_ref to official control_id.
# severity: Critical=4, High=3, Medium=2, Low=1 for default_weight in compliance_summary

framework: "CIS AWS Foundations Benchmark v6.0.0"
framework_version: "6.0.0"

controls:
  # --- 2 Identity and Access Management ---
  - control_id: "2.1"
    title: "Maintain current contact details"
    service: IAM
    severity: Low
    profile: Level 1
    assessment_status: Manual
    # No Steampipe automation
  - control_id: "2.2"
    title: "Ensure security contact information is registered"
    service: IAM
    severity: Low
    profile: Level 1
    assessment_status: Manual
  - control_id: "2.3"
    title: "Ensure no 'root' user account access key exists"
    service: IAM
    severity: Critical
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-root-access-keys
  - control_id: "2.4"
    title: "Ensure MFA is enabled for the 'root' user account"
    service: IAM
    severity: Critical
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-root-mfa
  - control_id: "2.5"
    title: "Ensure hardware MFA is enabled for the 'root' user account"
    service: IAM
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "2.6"
    title: "Eliminate use of the 'root' user for administrative and daily tasks"
    service: IAM
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "2.7"
    title: "Ensure IAM password policy requires minimum length of 14 or greater"
    service: IAM
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-password-min-length
  - control_id: "2.8"
    title: "Ensure IAM password policy prevents password reuse"
    service: IAM
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-password-reuse
  - control_id: "2.9"
    title: "Ensure multi-factor authentication (MFA) is enabled for all IAM users that have a console password"
    service: IAM
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-user-mfa
  - control_id: "2.10"
    title: "Do not create access keys during initial setup for IAM users with a console password"
    service: IAM
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "2.11"
    title: "Ensure credentials unused for 45 days or more are disabled"
    service: IAM
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-credentials-unused
  - control_id: "2.12"
    title: "Ensure there is only one active access key for any single IAM user"
    service: IAM
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-single-access-key
  - control_id: "2.13"
    title: "Ensure access keys are rotated every 90 days or less"
    service: IAM
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-access-key-rotation
  - control_id: "2.14"
    title: "Ensure IAM users receive permissions only through groups"
    service: IAM
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-permissions-via-groups
  - control_id: "2.15"
    title: "Ensure IAM policies that allow full \"*:*\" administrative privileges are not attached"
    service: IAM
    severity: Critical
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-admin-policies
  - control_id: "2.16"
    title: "Ensure a support role has been created to manage incidents with AWS Support"
    service: IAM
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-support-role
  - control_id: "2.17"
    title: "Ensure IAM instance roles are used for AWS resource access from instances"
    service: IAM
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-instance-roles
  - control_id: "2.18"
    title: "Ensure that all expired SSL/TLS certificates stored in AWS IAM are removed"
    service: IAM
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-expired-certificates
  - control_id: "2.19"
    title: "Ensure that IAM External Access Analyzer is enabled for all regions"
    service: IAM
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: iam-access-analyzer
  - control_id: "2.20"
    title: "Ensure IAM users are managed centrally via identity federation or AWS Organizations"
    service: IAM
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "2.21"
    title: "Ensure access to AWSCloudShellFullAccess is restricted"
    service: IAM
    severity: Low
    profile: Level 1
    assessment_status: Manual

  # --- 3 Storage ---
  - control_id: "3.1.1"
    title: "Ensure S3 Bucket Policy is set to deny HTTP requests"
    service: S3
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: s3-deny-http
  - control_id: "3.1.2"
    title: "Ensure MFA Delete is enabled on S3 buckets"
    service: S3
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "3.1.3"
    title: "Ensure all data in Amazon S3 has been discovered, classified, and secured when necessary"
    service: S3
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "3.1.4"
    title: "Ensure that S3 is configured with 'Block Public Access' enabled"
    service: S3
    severity: Critical
    profile: Level 1
    assessment_status: Automated
    control_ref: s3-public-access
  - control_id: "3.2.1"
    title: "Ensure that encryption-at-rest is enabled for RDS instances"
    service: RDS
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: rds-encryption
  - control_id: "3.2.2"
    title: "Ensure the Auto Minor Version Upgrade feature is enabled for RDS instances"
    service: RDS
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: rds-auto-upgrade
  - control_id: "3.2.3"
    title: "Ensure that RDS instances are not publicly accessible"
    service: RDS
    severity: Critical
    profile: Level 1
    assessment_status: Automated
    control_ref: rds-public
  - control_id: "3.2.4"
    title: "Ensure Multi-AZ deployments are used for enhanced availability in Amazon RDS"
    service: RDS
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "3.3.1"
    title: "Ensure that encryption is enabled for EFS file systems"
    service: EFS
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: efs-encryption

  # --- 4 Logging ---
  - control_id: "4.1"
    title: "Ensure CloudTrail is enabled in all regions"
    service: CloudTrail
    severity: Critical
    profile: Level 1
    assessment_status: Manual
  - control_id: "4.2"
    title: "Ensure CloudTrail log file validation is enabled"
    service: CloudTrail
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: cloudtrail-validation
  - control_id: "4.3"
    title: "Ensure AWS Config is enabled in all regions"
    service: Config
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: config-enabled
  - control_id: "4.4"
    title: "Ensure that server access logging is enabled on the CloudTrail S3 bucket"
    service: CloudTrail
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "4.5"
    title: "Ensure CloudTrail logs are encrypted at rest using KMS CMKs"
    service: CloudTrail
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: cloudtrail-kms
  - control_id: "4.6"
    title: "Ensure rotation for customer-created symmetric CMKs is enabled"
    service: KMS
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: kms-rotation
  - control_id: "4.7"
    title: "Ensure VPC flow logging is enabled in all VPCs"
    service: VPC
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: vpc-flow-logs
  - control_id: "4.8"
    title: "Ensure that object-level logging for write events is enabled for S3 buckets"
    service: CloudTrail
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: s3-write-logging
  - control_id: "4.9"
    title: "Ensure that object-level logging for read events is enabled for S3 buckets"
    service: CloudTrail
    severity: Medium
    profile: Level 1
    assessment_status: Automated
    control_ref: s3-read-logging

  # --- 5 Monitoring (mostly Manual) ---
  - control_id: "5.1"
    title: "Ensure unauthorized API calls are monitored"
    service: CloudWatch
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.2"
    title: "Ensure management console sign-in without MFA is monitored"
    service: CloudWatch
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.3"
    title: "Ensure usage of the 'root' account is monitored"
    service: CloudWatch
    severity: Critical
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.4"
    title: "Ensure IAM policy changes are monitored"
    service: CloudWatch
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.5"
    title: "Ensure CloudTrail configuration changes are monitored"
    service: CloudWatch
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.6"
    title: "Ensure AWS Management Console authentication failures are monitored"
    service: CloudWatch
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.7"
    title: "Ensure disabling or scheduled deletion of customer created CMKs is monitored"
    service: CloudWatch
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.8"
    title: "Ensure S3 bucket policy changes are monitored"
    service: CloudWatch
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.9"
    title: "Ensure AWS Config configuration changes are monitored"
    service: CloudWatch
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.10"
    title: "Ensure security group changes are monitored"
    service: CloudWatch
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.11"
    title: "Ensure Network Access Control List (NACL) changes are monitored"
    service: CloudWatch
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.12"
    title: "Ensure changes to network gateways are monitored"
    service: CloudWatch
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.13"
    title: "Ensure route table changes are monitored"
    service: CloudWatch
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.14"
    title: "Ensure VPC changes are monitored"
    service: CloudWatch
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.15"
    title: "Ensure AWS Organizations changes are monitored"
    service: CloudWatch
    severity: High
    profile: Level 1
    assessment_status: Manual
  - control_id: "5.16"
    title: "Ensure AWS Security Hub is enabled"
    service: Security Hub
    severity: High
    profile: Level 2
    assessment_status: Automated
    control_ref: security-hub-enabled

  # --- 6 Networking ---
  - control_id: "6.1.1"
    title: "Ensure EBS volume encryption is enabled in all regions"
    service: EC2
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: ebs-encryption-default
  - control_id: "6.1.2"
    title: "Ensure CIFS access is restricted to trusted networks to prevent unauthorized access"
    service: EC2
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: cifs-restricted
  - control_id: "6.2"
    title: "Ensure no Network ACLs allow ingress from 0.0.0.0/0 to remote server administration ports"
    service: VPC
    severity: Critical
    profile: Level 1
    assessment_status: Automated
    control_ref: nacl-admin-ports
  - control_id: "6.3"
    title: "Ensure no security groups allow ingress from 0.0.0.0/0 to remote server administration ports"
    service: EC2
    severity: Critical
    profile: Level 1
    assessment_status: Automated
    control_ref: sg-admin-ports-ipv4
  - control_id: "6.4"
    title: "Ensure no security groups allow ingress from ::/0 to remote server administration ports"
    service: EC2
    severity: Critical
    profile: Level 1
    assessment_status: Automated
    control_ref: sg-admin-ports-ipv6
  - control_id: "6.5"
    title: "Ensure the default security group of every VPC restricts all traffic"
    service: VPC
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: default-sg-restricts-traffic
  - control_id: "6.6"
    title: "Ensure routing tables for VPC peering are \"least access\""
    service: VPC
    severity: Medium
    profile: Level 1
    assessment_status: Manual
  - control_id: "6.7"
    title: "Ensure that the EC2 Metadata Service only allows IMDSv2"
    service: EC2
    severity: High
    profile: Level 1
    assessment_status: Automated
    control_ref: ec2-imdsv2

# Severity weights for compliance_summary (optional override)
severity_weights:
  Critical: 4
  High: 3
  Medium: 2
  Low: 1
